spring:
  application:
    name: senkyc-api
  datasource:
    url: ${SENKYC_DB_URL:jdbc:postgresql://localhost:5432/senkyc}
    # Compte APPLICATIF (senkyc_app) : sans droit DDL, soumis à la RLS.
    username: ${SENKYC_DB_USERNAME:senkyc_app}
    # Pas de valeur par défaut : le démarrage échoue si le secret n'est pas fourni.
    password: ${SENKYC_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Compte de MIGRATION (propriétaire du schéma), distinct du compte applicatif.
    url: ${SENKYC_DB_URL:jdbc:postgresql://localhost:5432/senkyc}
    user: ${SENKYC_MIGRATION_DB_USERNAME:senkyc}
    password: ${SENKYC_MIGRATION_DB_PASSWORD}
    # "prod" par défaut : les données de démo (contexte "dev") ne sont jamais appliquées par accident.
    contexts: ${SENKYC_LIQUIBASE_CONTEXTS:prod}
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Les détails des composants ne sont jamais exposés par défaut.
      show-details: ${SENKYC_HEALTH_DETAILS:never}
      group:
        readiness:
          include: readinessState,db,aiService

senkyc:
  security:
    jwt:
      # Valeur attendue du claim "iss" (URL publique de Keycloak).
      issuer: ${SENKYC_JWT_ISSUER:http://localhost:8081/realms/senkyc}
      # URL des clés de signature (peut être interne au réseau Docker).
      jwk-set-uri: ${SENKYC_JWT_JWK_SET_URI:http://localhost:8081/realms/senkyc/protocol/openid-connect/certs}
      audience: ${SENKYC_JWT_AUDIENCE:senkyc-api}
  # Pays activés. Un pays absent est refusé. Pour chaque pays activé :
  #   documents : type de document (NATIONAL_ID, PASSPORT, DRIVING_LICENSE) -> identifiant du connecteur
  #               de vérification d'intégrité. Type absent = pas de contrôle d'intégrité (KYC commun seulement).
  # Un connecteur n'est appelé que si le tenant y a droit (tenant.official_verification_enabled). Aucun
  # connecteur n'est fourni par défaut : voir docs/adr/0010-perimetre-produit-et-editions.md.
  countries:
    SN:
      enabled: true
      documents: {}
  storage:
    # Désactivé par défaut. Activé : serveur S3 joignable et clés valides exigés au démarrage.
    enabled: ${SENKYC_STORAGE_ENABLED:false}
    s3:
      endpoint: ${SENKYC_STORAGE_S3_ENDPOINT:http://localhost:9000}
      region: ${SENKYC_STORAGE_S3_REGION:us-east-1}
      bucket: ${SENKYC_STORAGE_S3_BUCKET:senkyc-documents}
      # Pas de valeur par défaut pour les secrets.
      access-key: ${SENKYC_STORAGE_S3_ACCESS_KEY}
      secret-key: ${SENKYC_STORAGE_S3_SECRET_KEY}
    encryption:
      current-key-id: ${SENKYC_STORAGE_ENCRYPTION_CURRENT_KEY_ID}
      # Clés base64 de 32 octets : variables SENKYC_STORAGE_ENCRYPTION_KEYS_<ID> (ID en minuscules : k1...).
  ai:
    base-url: ${SENKYC_AI_BASE_URL:http://localhost:8000}
    # Pas de valeur par défaut : secret partagé avec le service IA.
    internal-token: ${SENKYC_AI_INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 5s

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
